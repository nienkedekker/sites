[project]
name = "recs"
version = "0.1.0"
description = "Content-based recommendations from the what.pm log"
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=0.30",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "sentence-transformers>=3.0",
]

[project.scripts]
fetch-whatpm = "recs.fetch_whatpm:main"
enrich = "recs.enrich:main"
build-catalog = "recs.build_catalog:main"
embed = "recs.embed:main"
evaluate = "recs.evaluate:main"
recommend = "recs.recommend:main"

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
    "matplotlib>=3.9",
    "scikit-learn>=1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recs"]
